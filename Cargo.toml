[package]
name = "dictate"
version = "0.7.0"
description = "Superwhisper-like voice typing in pure Rust"
edition = "2024"
license = "MIT"
repository = "https://github.com/saostad/dictate"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
directories = "6.0.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui_glow = { version = "0.37.0", features = ["winit"] }
enigo = { version = "0.6.1", features = ["wayland", "x11rb"] }
global-hotkey = "0.8.0"
glutin = "0.32"
glutin-winit = "0.5.0"
hound = "3.5.1"
notify-rust = "4.18.2"
parakeet-rs = { version = "0.4.1", default-features = false, features = ["cpu", "api-28"] }
realfft = "3.5.0"
rubato = "5.0.1"
serde_json = "1.0.154"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
ureq = "3.4.2"
winit = "0.30.13"

[features]
default = ["bundled-ort"]
bundled-ort = ["parakeet-rs/ort-defaults"]
system-ort = ["parakeet-rs/load-dynamic"]

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEvent", "CGEventTypes"] }
