[package]
name = "dictate"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
directories = "6.0.0"
enigo = { version = "0.6.1", features = ["wayland", "x11rb"] }
hound = "3.5.1"
parakeet-rs = { version = "0.4.1", default-features = false, features = ["cpu", "api-28"] }
rubato = "5.0.1"
ureq = "3.4.2"

[features]
default = ["bundled-ort"]
bundled-ort = ["parakeet-rs/ort-defaults"]
system-ort = ["parakeet-rs/load-dynamic"]
